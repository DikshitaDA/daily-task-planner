<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskStream | Daily Task Planner</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS CDN & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="container planner-container py-5 my-auto">
        <div class="card app-card shadow-lg p-4 p-md-5">
            
            <!-- Header Section with Current Date -->
            <header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center pb-4 mb-4 border-bottom border-secondary border-opacity-25 gap-3">
                <div>
                    <h1 class="h3 fw-bold mb-1 title-gradient">
                        <i class="bi bi-check2-square text-primary me-2"></i>TaskStream
                    </h1>
                    <div id="currentDate" class="text-secondary small fw-medium"></div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge status-pill" id="pendingCounter">0 Pending</span>
                    <span class="badge status-pill completed-pill" id="completedCounter">0 Done</span>
                </div>
            </header>

            <!-- Task Input Form -->
            <form id="taskForm" class="mb-4">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="form-control custom-input py-3 px-3 shadow-none" 
                        placeholder="What objective requires execution today? (Press Enter)..." 
                        autocomplete="off"
                        required
                    >
                    <button class="btn btn-primary px-4 fw-semibold custom-btn" type="submit" id="addBtn">
                        <i class="bi bi-plus-lg me-1"></i>Add
                    </button>
                </div>
                <div id="validationAlert" class="text-danger small mt-2 d-none">
                    <i class="bi bi-exclamation-circle me-1"></i>Task content cannot be empty.
                </div>
            </form>

            <!-- Status Filters (All, Pending, Completed) -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div class="btn-group btn-group-sm filter-group" role="group" id="filterControls">
                    <button type="button" class="btn filter-btn active" data-filter="all">All</button>
                    <button type="button" class="btn filter-btn" data-filter="pending">Pending</button>
                    <button type="button" class="btn filter-btn" data-filter="completed">Completed</button>
                </div>
                <button id="clearCompletedBtn" class="btn btn-sm text-danger border-0 p-0 text-decoration-none hover-underline">
                    <i class="bi bi-trash3 me-1"></i>Clear Completed
                </button>
            </div>

            <!-- Task List Container -->
            <ul id="taskList" class="list-group list-group-flush gap-2">
                <!-- Dynamically populated via script.js -->
            </ul>

            <!-- Empty State Notice -->
            <div id="emptyNotice" class="text-center py-5 text-secondary d-none">
                <i class="bi bi-clipboard2-check fs-1 d-block mb-2 text-primary opacity-50"></i>
                <span class="small">No tasks found in this view.</span>
            </div>

        </div>

        <footer class="text-center text-secondary small mt-4">
            Daily Task Planner &bull; Changes saved automatically to LocalStorage
        </footer>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
